# Heatwave-AI — design reference (research-aligned pipeline).
#
# NOTE: the pipeline reads its parameters from code/env, NOT this file. This
# documents the CURRENT design. The previous heat_index + random-split config was
# removed because it encoded the target/temporal leakage identified in
# RESEARCH_REVIEW_2026-05-30.md.

project:
  name: Heatwave-AI
  description: Region-specific (77-province) heatwave forecasting for Thailand

data:
  source: open-meteo          # ERA5 archive (history) + forecast API. No local NetCDF/NDVI.
  variables: [temperature_2m_max, relative_humidity_2m_mean]
  env:                        # tuned via environment variables (pipeline.build_dataset)
    OPENMETEO_START_YEAR: 2010   # default fits the free tier; 1991 needs OPENMETEO_API_KEY
    OPENMETEO_END_YEAR: 2025
    OPENMETEO_REQUEST_DELAY: 3.0

label:
  index: sWBGT                # simplified shade WBGT (humidity-aware) — not US heat index
  threshold: per-province percentile (p95) by day-of-year
  persistence_days: 2         # >= 2 consecutive exceedance days (WMO / Thai TMD style)
  climatology_baseline: 1991-2020   # auto-uses the fetched years if the range is shorter

split:
  type: temporal              # NOT random — prevents temporal leakage
  train: "<= 2023"
  validation: 2024            # isotonic calibration + F2 threshold tuning
  test: 2025                  # held-out; honest metrics vs a constant baseline

model:
  type: lightgbm
  forecasting_horizons_days: [1, 2, 3, 4, 5, 6, 7]
  calibration: isotonic
  metrics: [pr_auc, mcc, f2, roc_auc, brier]   # accuracy intentionally excluded (rare event)

storage:
  model: huggingface          # heatwave_model.pkl (e.g. MCTEEKUNG123/Heatwave-AI)
  forecasts: supabase         # heatwave.forecasts
  thresholds: supabase        # heatwave.province_thresholds
