# Daily heatwave forecast → Supabase (Track M6 — closes the staleness loop).
#
# Lives on the default branch (master) so the `schedule:` trigger fires, but
# checks out the verified flat ML code from the active dev branch (master's
# own Python lives under Heatwave-AI-TRAIN/, a different lineage). The model +
# thresholds are pulled from the public HF repo, so no large files are needed
# in git. Writes the 77-province forecast to the private `heatwave` schema.
#
# Requires repo secret DATABASE_URL (Supabase pooler :6543) — set 2026-06-05.
name: daily-forecast

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 08:30 Asia/Bangkok
  workflow_dispatch: {}

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The forecast pipeline (flat scripts/, pipeline/, src/) lives here.
          ref: feat/clean-era5-ndvi-dataset

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install forecast dependencies (minimal — no geo stack)
        run: |
          pip install --upgrade pip
          pip install \
            "numpy>=1.24" "pandas>=2.0" "scikit-learn>=1.3,<2" "lightgbm>=4,<5" \
            "joblib>=1.3" "pyarrow>=14" "psycopg[binary]>=3.1" "requests>=2.31" \
            "scipy>=1.11" "pyyaml>=6" "python-dotenv>=1.0"

      - name: Pull model + thresholds from Hugging Face
        run: |
          mkdir -p models data/processed
          base=https://huggingface.co/MCTEEKUNG123/Heatwave-AI/resolve/main/forecast
          curl -fsSL "$base/heatwave_model.pkl"          -o models/heatwave_model.pkl
          curl -fsSL "$base/province_thresholds.parquet" -o data/processed/province_thresholds.parquet
          ls -la models/heatwave_model.pkl data/processed/province_thresholds.parquet

      - name: Run daily forecast (77 provinces → Supabase)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEATWAVE_SLEEP: "6"
        run: |
          python scripts/run_daily_forecast.py --batch-size 5 --state-file forecast_state.json

      - name: Upload run state (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-state
          path: forecast_state.json
          if-no-files-found: ignore
